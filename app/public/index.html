<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>WebSSH</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="stylesheet" href="/style.css?v=19" />
</head>
<body data-theme="dark">
  <script>
    (function () {
      function getBanner() {
        var element = document.getElementById('webssh-error-banner');
        if (!element) {
          element = document.createElement('div');
          element.id = 'webssh-error-banner';
          element.setAttribute('role', 'alert');
          element.style.cssText = 'position:fixed;z-index:99999;top:12px;left:50%;transform:translateX(-50%);max-width:min(560px,calc(100vw - 24px));padding:10px 12px;color:#fecaca;background:rgba(96,13,22,.97);border:1px solid rgba(248,113,113,.72);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);font:12px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;word-break:break-all;cursor:pointer;';
          element.title = '点击关闭';
          element.addEventListener('click', function () { element.style.display = 'none'; });
          document.body.appendChild(element);
        }
        return element;
      }
      function messageOf(error) {
        if (typeof error === 'string') return error;
        if (error && error.message) return error.message;
        if (error) return String(error);
        return '未知错误';
      }
      var lastErrorShown = 0;
      var lastErrorMessage = '';
      var errorHideTimer = null;
      window.__websshShowError = function (message) {
        var now = Date.now();
        if (message === lastErrorMessage && now - lastErrorShown < 4000) return;
        lastErrorMessage = message;
        lastErrorShown = now;
        var element = getBanner();
        element.textContent = '页面错误：' + message;
        element.style.display = 'block';
        clearTimeout(errorHideTimer);
        errorHideTimer = setTimeout(function () { element.style.display = 'none'; }, 8000);
        try { console.error('WebSSH 页面错误：', message); } catch (ignore) {}
        try { fetch('/api/log-client-error', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: String(message).slice(0, 2000) }) }); } catch (ignore) {}
      };
      window.addEventListener('error', function (event) {
        if (event.target && event.target !== window) {
          try { console.warn('WebSSH 资源加载失败（忽略，不提示）：' + (event.filename || event.target.src || event.target.href || '')); } catch (ignore) {}
          return;
        }
        var detail = messageOf(event.error || event.message);
        if (detail.indexOf('ResizeObserver loop') !== -1) {
          try { console.warn('WebSSH 已知良性错误（浏览器自身处理，忽略）：' + detail); } catch (ignore) {}
          return;
        }
        var source = '';
        if (event.filename) {
          var origin = '';
          try { origin = location.origin || ''; } catch (ignore) {}
          source = ' (' + event.filename.replace(origin, '') + ':' + event.lineno + ')';
        }
        window.__websshShowError(detail + source);
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        if (reason && (reason.name === 'AbortError' || reason.name === 'NS_ERROR_ABORT')) return;
        window.__websshShowError('Promise 未捕获：' + messageOf(reason));
      });
    })();
  </script>
  <main class="app-shell">
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="connection-drawer" class="connection-panel" role="dialog" aria-modal="true" aria-labelledby="connection-drawer-title" aria-hidden="true">
      <div class="connection-drawer-head"><div class="brand"><span id="connection-drawer-title">新建连接</span><small>WebSSH</small></div><button id="close-drawer-button" class="icon-button drawer-close-button" type="button" aria-label="关闭新建会话" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <section id="saved-connections-section" class="saved-connections-section" aria-labelledby="saved-connections-title" hidden>
        <div class="drawer-divider" id="saved-connections-title" role="heading" aria-level="2"><span>保存连接</span></div>
        <div id="profile-list" class="profile-list" aria-label="已保存的连接"></div>
      </section>
      <p id="profile-feedback" class="profile-feedback" role="status" hidden></p>
      <div class="drawer-divider" role="separator" aria-hidden="true"><span>新建连接</span></div>
      <form id="connection-form">
        <label>名称<input name="name" placeholder="例如：生产服务器" autocomplete="off" required /></label>
        <label>主机<input name="host" placeholder="example.com 或 192.168.1.10" required autocomplete="off" /></label>
        <div class="two-columns">
          <label>端口<input name="port" type="number" value="22" min="1" max="65535" required /></label>
          <label>用户<input name="username" placeholder="root" required autocomplete="username" /></label>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-mode="password">密码</button>
          <button type="button" class="tab" data-mode="key">私钥</button>
        </div>
        <div id="password-fields"><label>密码<div class="password-input-wrap"><input name="password" type="password" autocomplete="current-password" /><button class="password-visibility-toggle" type="button" data-password-toggle aria-label="显示密码" aria-pressed="false" title="显示密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5.2 0-9.3 3.5-10.7 7 1.4 3.5 5.5 7 10.7 7s9.3-3.5 10.7-7C21.3 8.5 17.2 5 12 5Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-2a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" /></svg></button></div></label></div>
        <div id="key-fields" hidden>
          <label>私钥内容<textarea name="privateKey" rows="6" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>
        </div>
        <div class="connection-actions"><button id="save-profile-button" class="secondary-action icon-action" type="button" aria-label="保存连接" title="保存连接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l3 3v15H4V4a1 1 0 0 1 1-1Zm2 2v5h9V5H7Zm-1 14h12v-7H6v7Zm3-5h6v3H9v-3Z" /></svg></button><button id="connect-button" class="connect-button" type="submit" aria-label="连接终端" title="连接终端"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></button></div>
      </form>
    </aside>
    <div id="file-picker-backdrop" class="file-picker-backdrop" hidden></div>
    <section id="file-picker" class="file-picker" role="dialog" aria-modal="true" aria-labelledby="file-picker-title" hidden>
      <header><div class="file-picker-heading"><span class="file-picker-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span><div><strong id="file-picker-title">下载文件</strong><small>选择当前目录中的文件保存到本机</small></div></div><button id="close-file-picker-button" class="icon-button" type="button" aria-label="关闭文件列表" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <form id="file-picker-directory-form" class="file-picker-directory"><input id="file-picker-directory-input" class="file-picker-path" type="text" inputmode="text" autocomplete="off" placeholder="请输入远程目录，例如 /home/user" aria-label="远程下载目录" /><div class="file-picker-directory-actions"><button id="file-picker-parent-button" type="button" class="directory-nav-button" aria-label="返回上一级目录" title="上一级"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 3h10v9H3z"/><path d="M12 18V9"/><path d="m8.5 12.5 3.5-3.5 3.5 3.5"/></svg></button><button type="submit" class="directory-read-button" aria-label="读取目录" title="读取目录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 3h10v9H3z"/><path d="M3 10h18"/><path d="M8 15h8"/></svg></button></div></form>
      <div id="file-picker-list" class="file-picker-list"></div>
      <footer class="file-picker-footer"><span id="file-picker-selection-count" aria-live="polite">未选择文件</span><button id="download-selected-button" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>下载所选文件</button></footer>
    </section>
    <div id="upload-picker-backdrop" class="file-picker-backdrop" hidden></div>
    <section id="upload-picker" class="file-picker" role="dialog" aria-modal="true" aria-labelledby="upload-picker-title" hidden>
      <header><div class="file-picker-heading"><span class="file-picker-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg></span><div><strong id="upload-picker-title">上传文件</strong><small>先确认远程目录，再选择要上传的本地文件</small></div></div><button id="close-upload-picker-button" class="icon-button" type="button" aria-label="关闭上传窗口" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <form id="upload-directory-form" class="file-picker-directory"><input id="upload-directory-input" class="file-picker-path" type="text" inputmode="text" autocomplete="off" placeholder="请输入远程目录，例如 /home/user" aria-label="远程上传目录" required /><div class="file-picker-directory-actions"><button id="upload-picker-parent-button" type="button" class="directory-nav-button" aria-label="返回上一级目录" title="上一级"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 3h10v9H3z"/><path d="M12 18V9"/><path d="m8.5 12.5 3.5-3.5 3.5 3.5"/></svg></button><button type="submit" class="directory-read-button" aria-label="读取目录" title="读取目录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 3h10v9H3z"/><path d="M3 10h18"/><path d="M8 15h8"/></svg></button></div></form>
      <p id="upload-directory-error" class="upload-directory-error" role="alert" hidden></p>
      <div id="upload-picker-list" class="file-picker-list" aria-label="当前目录"></div>
      <footer class="file-picker-footer"><span>选择本地文件上传到当前远程目录</span><button id="upload-selected-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>上传文件</button></footer>
    </section>
    <div id="upload-conflict-backdrop" class="file-picker-backdrop upload-conflict-backdrop" hidden></div>
    <section id="upload-conflict-dialog" class="upload-conflict-dialog" role="dialog" aria-modal="true" aria-labelledby="upload-conflict-title" hidden>
      <header class="upload-conflict-header"><span class="upload-conflict-icon" aria-hidden="true">!</span><div><strong id="upload-conflict-title">上传冲突</strong></div></header>
      <p class="upload-conflict-intro">目标目录中已有同名文件，请选择处理方式。</p>
      <div id="upload-conflict-message" class="upload-conflict-file"></div>
      <div class="upload-conflict-actions"><button id="upload-conflict-cancel" class="upload-conflict-cancel" type="button">取消</button><button id="upload-conflict-rename" class="upload-conflict-option" type="button"><span>重命名</span><small>保留原文件，创建新副本</small></button><button id="upload-conflict-overwrite" class="upload-conflict-option" type="button"><span>覆盖</span><small>替换远程原文件</small></button></div>
    </section>
    <div id="shutdown-confirm-backdrop" class="shutdown-confirm-backdrop" hidden></div>
    <section id="shutdown-confirm-dialog" class="shutdown-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="shutdown-confirm-title" hidden>
      <span class="shutdown-confirm-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span>
      <div class="shutdown-confirm-body">
        <span class="shutdown-confirm-eyebrow">SERVICE SHUTDOWN</span>
        <strong id="shutdown-confirm-title">确定关闭 WebSSH 服务吗？</strong>
        <p id="shutdown-confirm-description">所有 SSH 会话将断开，且无法恢复。请确认您已保存好相关操作。</p>
      </div>
      <div class="shutdown-confirm-actions"><button id="shutdown-confirm-cancel" class="shutdown-confirm-cancel" type="button">取消</button><button id="shutdown-confirm-confirm" class="shutdown-confirm-confirm" type="button">确认关闭</button></div>
    </section>
    <div id="profile-overwrite-backdrop" class="shutdown-confirm-backdrop" hidden></div>
    <section id="profile-overwrite-dialog" class="shutdown-confirm-dialog profile-overwrite-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-overwrite-title" hidden>
      <span class="shutdown-confirm-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12"/><path d="M10 3l4 4-4 4"/><path d="M4 17h12"/><path d="M10 13l4 4-4 4"/></svg></span>
      <div class="shutdown-confirm-body">
        <span class="shutdown-confirm-eyebrow">PROFILE CONFLICT</span>
        <strong id="profile-overwrite-title">连接配置已存在</strong>
        <p id="profile-overwrite-description"></p>
      </div>
      <div class="shutdown-confirm-actions"><button id="profile-overwrite-cancel" class="shutdown-confirm-cancel" type="button">取消</button><button id="profile-overwrite-confirm" class="shutdown-confirm-confirm" type="button">覆盖</button></div>
    </section>
    <section class="terminal-panel">
      <header><div class="connection-status"><strong id="status-dot"></strong><span id="status">未连接</span><span id="connection-health" aria-live="polite"></span></div><div class="header-actions"><div class="terminal-settings"><button id="terminal-settings-button" class="icon-button" type="button" aria-label="终端字体设置" title="终端字体设置" aria-expanded="false">A</button><div id="terminal-settings-menu" class="terminal-settings-menu" hidden><strong class="menu-heading">终端字体</strong><label>字体大小 <output id="font-size-value">14px</output><input id="font-size-input" type="range" min="10" max="24" step="1" value="14" /></label><label>字体粗细 <output id="font-weight-value">400</output><input id="font-weight-input" type="range" min="100" max="900" step="1" value="400" /></label><label>字符间距 <output id="letter-spacing-value">0px</output><input id="letter-spacing-input" type="range" min="-2" max="8" step="0.1" value="0" /></label><label>字体颜色 <span class="color-field"><input id="font-color-input" type="color" value="#d8e3f1" /><output id="font-color-value">#d8e3f1</output></span></label></div></div><div class="terminal-settings"><button id="background-settings-button" class="icon-button" type="button" aria-label="网站背景设置" title="网站背景设置" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="url(#bg-settings-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="bg-settings-grad" x1="3" y1="4" x2="21" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#a5f3fc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5" fill="url(#bg-settings-grad)" stroke="none"/><path d="M21 15.5 15.5 10 5.5 20"/><path d="M13 20h8"/></svg></button><div id="background-settings-menu" class="terminal-settings-menu" hidden><strong class="menu-heading">背景图片 <span id="background-status-dot" class="background-status-dot" data-has-bg="false"></span></strong><button id="background-upload-button" class="settings-action-button" type="button">上传背景图片</button><input id="background-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden /><label>透明度 <output id="background-opacity-value">50%</output><input id="background-opacity-input" type="range" min="0" max="100" step="1" value="50" /></label><button id="background-remove-button" class="settings-action-button" type="button" disabled>移除背景</button></div></div><button id="theme-button" class="icon-button" type="button" aria-label="切换主题" title="切换为浅色主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></button><button id="upload-button" class="icon-button" type="button" aria-label="上传文件" title="上传文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg></button><button id="download-button" class="icon-button" type="button" aria-label="下载文件" title="下载文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button><button id="shutdown-button" class="icon-button shutdown-button" type="button" aria-label="关闭 WebSSH 服务" title="关闭 WebSSH 服务"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v10h-2V2Zm5.66 2.76 1.42 1.42A8 8 0 1 1 5.92 6.18l1.42-1.42A6 6 0 1 0 16.66 4.76Z" /></svg></button><input id="upload-input" type="file" multiple hidden /></div></header>
      <nav class="session-tabs" aria-label="SSH 会话"><div id="session-tabs" class="session-tabs-scroll" role="tablist"></div><button id="new-session-button" class="new-session-button" type="button" aria-label="新建连接" title="新建连接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></nav>
      <div id="terminal" aria-live="polite">
        <section id="terminal-empty-state" class="terminal-empty-state" aria-labelledby="terminal-empty-title">
          <img class="terminal-empty-icon" src="/icon.png" alt="" aria-hidden="true" />
          <p class="terminal-empty-eyebrow">WEBSSH</p>
          <h1 id="terminal-empty-title">开始一个纯粹的远程会话</h1>
          <p class="terminal-empty-description">连接服务器后，即可在此使用 SSH 终端并管理文件传输。</p>
          <button id="empty-state-connect-button" type="button"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span> 新建连接</button>
        </section>
      </div>
      <aside id="transfer-panel" class="transfer-panel" aria-live="polite"></aside>
    </section>
  </main>
  <script type="module" src="/app.js?v=16"></script>
</body>
</html>
